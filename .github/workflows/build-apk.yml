name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GAME_FILE: FUSION_VR_V1_0.html
  APP_ID: com.fusionvr.app
  APP_NAME: FUSION VR

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar projeto Capacitor com o jogo
        run: |
          test -f "$GAME_FILE" || { echo "ERRO: arquivo $GAME_FILE não encontrado na raiz do repositório"; exit 1; }
          mkdir -p www
          cp "$GAME_FILE" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "backgroundColor": "#080d18",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android

      - name: Permissão de câmera + tela sempre ligada + tela cheia
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"

          JAVA_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$JAVA_DIR"
          cat > "$JAVA_DIR/MainActivity.java" <<EOF
          package $APP_ID;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      WindowInsetsControllerCompat c =
                          WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                      c.hide(WindowInsetsCompat.Type.systemBars());
                      c.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              }
          }
          EOF

      - name: Sincronizar e compilar o APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FUSION_VR_V1_0.apk

      - name: Guardar o APK (aba Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FUSION_VR_V1_0-apk
          path: FUSION_VR_V1_0.apk

      - name: Publicar em Releases (link direto de download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FUSION VR V1.0 (build ${{ github.run_number }})
          files: FUSION_VR_V1_0.apk
